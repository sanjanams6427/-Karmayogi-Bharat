<!DOCTYPE html>
<html>
<head>
  <title>Segment Editor Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: #fff; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    pre { background: #0a0a15; padding: 15px; border-radius: 8px; overflow: auto; max-height: 300px; }
    .success { color: #2ecc71; }
    .error { color: #e74c3c; }
    table { border-collapse: collapse; width: 100%; margin: 20px 0; }
    th, td { border: 1px solid #333; padding: 8px; text-align: left; }
    th { background: #0f3460; }
    tr:hover { background: rgba(74, 158, 255, 0.1); cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 Segment Editor Diagnostic Test</h1>
  
  <div>
    <button onclick="testServer()">1. Test Server</button>
    <button onclick="testCreateSession()">2. Create Session</button>
    <button onclick="testLoadSegments()">3. Load Segments</button>
    <button onclick="testTranslate()">4. Translate Seg 0</button>
    <button onclick="testTTS()">5. Generate TTS</button>
  </div>
  
  <h3>Session ID: <span id="session-id">—</span></h3>
  
  <h3>Segments:</h3>
  <table id="seg-table">
    <thead><tr><th>ID</th><th>Time</th><th>Original</th><th>Translation</th><th>TTS</th></tr></thead>
    <tbody id="seg-tbody"><tr><td colspan="5">No segments loaded</td></tr></tbody>
  </table>
  
  <h3>Log:</h3>
  <pre id="log"></pre>

  <script>
    let sessionId = null;
    let segments = [];
    
    function log(msg, type = '') {
      const el = document.getElementById('log');
      const cls = type === 'ok' ? 'success' : type === 'err' ? 'error' : '';
      el.innerHTML = `<span class="${cls}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n` + el.innerHTML;
    }
    
    async function testServer() {
      log('Testing server...');
      try {
        const r = await fetch('/api/pipeline/status');
        const d = await r.json();
        log('Server: ' + JSON.stringify(d), 'ok');
      } catch (e) {
        log('Server error: ' + e.message, 'err');
      }
    }
    
    async function testCreateSession() {
      log('Creating session with existing file...');
      try {
        // Use a known session
        const r = await fetch('/api/sessions/3065bf93b737/segments');
        if (r.ok) {
          sessionId = '3065bf93b737';
          document.getElementById('session-id').textContent = sessionId;
          log('Using existing session: ' + sessionId, 'ok');
          await testLoadSegments();
        }
      } catch (e) {
        log('Error: ' + e.message, 'err');
      }
    }
    
    async function testLoadSegments() {
      if (!sessionId) { log('No session!', 'err'); return; }
      log('Loading segments...');
      try {
        const r = await fetch('/api/sessions/' + sessionId + '/segments');
        const d = await r.json();
        segments = d.segments || [];
        log('Loaded ' + segments.length + ' segments', 'ok');
        renderSegments();
      } catch (e) {
        log('Error: ' + e.message, 'err');
      }
    }
    
    function renderSegments() {
      const tbody = document.getElementById('seg-tbody');
      if (!segments.length) {
        tbody.innerHTML = '<tr><td colspan="5">No segments</td></tr>';
        return;
      }
      tbody.innerHTML = segments.map(s => `
        <tr onclick="selectSeg(${s.id})">
          <td>${s.id}</td>
          <td>${s.start.toFixed(1)}s</td>
          <td>${(s.original || '').substring(0, 40)}...</td>
          <td>${(s.translation || '—').substring(0, 40)}...</td>
          <td>${s.tts_duration ? s.tts_duration.toFixed(1) + 's' : '—'}</td>
        </tr>
      `).join('');
    }
    
    function selectSeg(id) {
      log('Selected segment ' + id, 'ok');
      window.selectedSegId = id;
    }
    
    async function testTranslate() {
      const segId = window.selectedSegId ?? 0;
      log('Translating segment ' + segId + '...');
      try {
        const r = await fetch('/api/sessions/' + sessionId + '/segments/' + segId + '/translate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: '{}'
        });
        const d = await r.json();
        log('Translated! Length: ' + (d.translation || '').length + ' chars', 'ok');
        await testLoadSegments();
      } catch (e) {
        log('Error: ' + e.message, 'err');
      }
    }
    
    async function testTTS() {
      const segId = window.selectedSegId ?? 0;
      log('Generating TTS for segment ' + segId + '...');
      try {
        const r = await fetch('/api/sessions/' + sessionId + '/segments/' + segId + '/tts', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: '{}'
        });
        const d = await r.json();
        log('TTS done! Duration: ' + d.tts_duration + 's, Audio: ' + (d.audio_url ? 'YES' : 'NO'), 'ok');
        await testLoadSegments();
      } catch (e) {
        log('Error: ' + e.message, 'err');
      }
    }
    
    // Auto-test on load
    testServer();
  </script>
</body>
</html>
